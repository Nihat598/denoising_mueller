# Calf brain (3 Nov 2026), two specimens.
brain_specimens:
  cavity_piece: [2026-11-03_113650_F_FF_HORAO_0000_001,
                 2026-11-03_120333_F_FF_HORAO_0000_002,
                 2026-11-03_120426_F_FF_HORAO_0000_003,
                 2026-11-03_123120_F_FF_HORAO_0000_004,
                 2026-11-03_123254_F_FF_HORAO_0000_005,
                 2026-11-03_123521_F_FF_HORAO_0000_006,
                 2026-11-03_123809_F_FF_HORAO_0000_007,
                 2026-11-03_124038_F_FF_HORAO_0000_008]
  slices:       [2026-11-03_152145_F_FF_HORAO_0000_009,
                 2026-11-03_152252_F_FF_HORAO_0000_010,
                 2026-11-03_152503_F_FF_HORAO_0000_011,
                 2026-11-03_152714_F_FF_HORAO_0000_012]

# Two-fold split by brain specimen (+ a model that never sees brain). Every brain acquisition is tested by a
# network that never saw its specimen. brain_val: one view of the TRAINING specimen, used only to pick the
# best checkpoint (not trained on).
folds:
  slices_test:
    brain_train: [cavity_piece]
    brain_val: [2026-11-03_123521_F_FF_HORAO_0000_006]
    brain_test: [slices]
  cavity_test:
    brain_train: [slices]
    brain_val: [2026-11-03_152252_F_FF_HORAO_0000_010]
    brain_test: [cavity_piece]
  objects_only:
    brain_train: []
    brain_val: []
    brain_test: [cavity_piece, slices]

training:
  levels: [intensity, mm]       # one network per level
  iterations: 50000
  batch: 16
  patch: 128                    # multiple of 32
  lr: 3.0e-4                    # Adam (beta2 0.99, as Lehtinen et al.), cosine decay to lr_min after warmup
  lr_min: 1.0e-6
  warmup: 500
  width: 48                     # U-Net features (Lehtinen et al.)
  residual: true                # network predicts the correction to its input
  target_frames: 1              # 1 = pure Noise2Noise (frame i -> frame j); k > 1: target = mean of k other frames
  brain_fraction: 0.3           # share of training patches drawn from brain views (when the fold has any)
  min_valid: 0.5                # redraw patches with less than 50% unsaturated pixels
  scale_quantile: 99            # input/target are divided by this percentile of |values| (stored in the checkpoint)
  val_every: 1000               # iterations between validations (best checkpoint = lowest val nM error)
  seed: 0
  amp: false                    # bfloat16 autocast on GPU (faster, slightly less precise)
