# Noise2Noise training on repeated polarimetric frames (scripts/train_n2n.py) and its evaluation
# (scripts/compare_levels.py --methods n2n). See docs/NOISE2NOISE.md.
paths: configs/paths.yaml       # data_root and calib_root must contain BOTH CALF_BRAIN and new_data (searched recursively)
wavelength: 630
register: true                  # integer-shift frames onto frame 1, as in the evaluation
subtract_dark: true             # level mm: M = A^-1 (I - dark) W^-1, as in the evaluation
saturation: 255                 # a pixel of a frame is saturated if any of its 16 channels reaches this count

# Acquisitions never used (checked 2026-11-26): 018 and 031 almost no light, 050 frames change between shots
# (noise 10x the others), 059 moves by ~5 px over the 16 frames.
exclude:
  - 2026-11-12_171729_F_FF_HORAO_0000_018
  - 2026-11-12_173222_F_FF_HORAO_0000_031
  - 2026-11-12_182335_F_FF_HORAO_0000_050
  - 2026-11-20_161127_F_FF_HORAO_0000_059


